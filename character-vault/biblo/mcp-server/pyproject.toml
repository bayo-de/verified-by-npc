[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "biblo-character-mcp"
version = "0.1.0"
description = "Biblo character IP — MCP server. Embody Biblo's voice inside any MCP-capable assistant. Internal draft."
readme = "README.md"
license = { text = "UNLICENSED — internal draft, no license granted" }
requires-python = ">=3.9"
dependencies = []

[project.scripts]
biblo-character-mcp = "biblo_character_mcp.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["biblo_character_mcp*"]
