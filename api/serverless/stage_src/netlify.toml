# NPC Verification API - Netlify site config.
#
# The static landing page lives in public/. The /v1/* paths proxy to the
# AWS Lambda API (see the redirects below); no API function ships in this
# bundle.

[build]
  publish = "public"

[functions]
  directory = "netlify/functions"

# Keep the API's URL shape: /v1/* proxies to the AWS Lambda API.
[[redirects]]
  from = "/v1/*"
  to = "https://no7xc8f0x5.execute-api.us-east-2.amazonaws.com/v1/:splat"
  status = 200

# OpenAI plugin domain verification: serve the portal-issued challenge token
# from the Lambda (env NPC_OPENAI_APPS_CHALLENGE) at the public well-known path.
[[redirects]]
  from = "/.well-known/openai-apps-challenge"
  to = "https://no7xc8f0x5.execute-api.us-east-2.amazonaws.com/.well-known/openai-apps-challenge"
  status = 200

[[headers]]
  for = "/v1/*"
  [headers.values]
    Cache-Control = "no-store"
