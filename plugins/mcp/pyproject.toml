[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "npc-verify-mcp"
version = "1.0.0"
description = "Verified by NPC — MCP server. Ask 'is this real?' inside any MCP-capable assistant."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = []

[project.scripts]
npc-verify-mcp = "npc_verify_mcp.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["npc_verify_mcp*"]
