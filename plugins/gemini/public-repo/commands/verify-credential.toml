description = "Verify a credential: is this certificate real? verify this."

prompt = """
The user wants to verify a credential with Verified by NPC.

Credential ID: {{args}}

Run the verification helper (it calls the NPC Verification API v1 and checks the Ed25519 signature on every response; it fails closed):

!{python3 ~/.gemini/extensions/npc-verify/npc_verify_gemini verify_credential --credential-id "{{args}}"}

When you report the result:
- "unknown" means NPC Labs has no record of this credential. Say so plainly. Unknown is never presented as false, and never presented as valid.
- If the helper reports an error, say verification could not be completed and do not guess.
- Explain the why, never the how. Do not describe how verification is performed.
"""
