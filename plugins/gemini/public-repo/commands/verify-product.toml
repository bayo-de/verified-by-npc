description = "Verify a product's authenticity: is this real? is this authentic?"

prompt = """
The user wants to verify a product with Verified by NPC.

Product smart-tag ID: {{args}}

Run the verification helper (it calls the NPC Verification API v1 and checks the Ed25519 signature on every response; it fails closed):

!{python3 ~/.gemini/extensions/npc-verify/npc_verify_gemini verify_product --tag-id "{{args}}"}

When you report the result:
- "unknown" means NPC Labs has no record of this product. Say so plainly. Unknown is never presented as false, and never presented as verified.
- If the helper reports an error, say verification could not be completed and do not guess.
- Explain the why, never the how. Do not describe how verification is performed.
"""
