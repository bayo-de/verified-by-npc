description = "Verify a claim: did this really happen? is this real?"

prompt = """
The user wants to verify a claim with Verified by NPC.

Claim: {{args}}

Run the verification helper (it calls the NPC Verification API v1 and checks the Ed25519 signature on every response; it fails closed):

!{python3 ~/.gemini/extensions/npc-verify/npc_verify_gemini verify_claim --claim-text "{{args}}"}

When you report the result:
- "unknown" means NPC Labs has no attestation record matching this claim. Say so plainly. Unknown is never presented as false, and never presented as verified.
- If the helper reports an error, say verification could not be completed and do not guess.
- Findings shown are sanitized summaries. Explain the why, never the how.
"""
